name: Release to Clojars

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: release
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 1

            -   name: Prepare Java
                uses: actions/setup-java@v6
                with:
                    distribution: "oracle"
                    java-version: "26"

            -   name: Install Clojure tools
                uses: DeLaGuardo/setup-clojure@13
                with:
                    lein: latest

            -   name: Cache dependencies
                uses: actions/cache@v6
                with:
                    path: |
                        ~/.m2/repository
                        ~/.lein
                    key: ${{ runner.os }}-lein-${{ hashFiles('project.clj') }}
                    restore-keys: ${{ runner.os }}-lein-

            -   name: Verify the tag matches project.clj
                # Leiningen has no :release flag, so nothing else stops a v0.1.0
                # tag from deploying a -SNAPSHOT under a release name.
                run: |
                    tag="${GITHUB_REF_NAME#v}"
                    declared=$(head -1 project.clj | cut -d'"' -f2)
                    if [ "$tag" != "$declared" ]; then
                      echo "FAIL: tag $GITHUB_REF_NAME does not match project.clj version $declared"
                      exit 1
                    fi
                    case "$declared" in
                      *-SNAPSHOT) echo "FAIL: refusing to release a snapshot version"; exit 1 ;;
                    esac
                    echo "PASS: releasing $declared"

            -   name: Test
                run: lein test

            -   name: Deploy
                env:
                    CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
                    CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
                run: lein deploy clojars
