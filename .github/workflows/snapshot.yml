name: Snapshot to Clojars

permissions:
    contents: read

on:
    workflow_run:
        workflows: [ "Tests" ]
        types: [ completed ]
        branches: [ "main" ]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    snapshot:
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.event == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: release
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    ref: ${{ github.event.workflow_run.head_sha }}
                    fetch-depth: 1

            -   name: Prepare Java
                uses: actions/setup-java@v6
                with:
                    distribution: "oracle"
                    java-version: "26"

            -   name: Install Clojure tools
                uses: DeLaGuardo/setup-clojure@13
                with:
                    lein: latest

            -   name: Cache Maven dependencies
                uses: actions/cache@v6
                with:
                    path: |
                        ~/.m2/repository
                        ~/.lein
                    key: ${{ runner.os }}-lein-${{ hashFiles('project.clj') }}
                    restore-keys: ${{ runner.os }}-lein-

            -   name: Verify the version is a snapshot
                # The mirror of the release guard: never publish a release
                # version from an ordinary push to main.
                run: |
                    declared=$(head -1 project.clj | cut -d'"' -f2)
                    case "$declared" in
                      *-SNAPSHOT) echo "PASS: deploying $declared" ;;
                      *) echo "FAIL: $declared is not a snapshot; releases are tag-driven"; exit 1 ;;
                    esac

            -   name: Deploy snapshot
                env:
                    CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
                    CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
                run: lein deploy clojars
